<mat-toolbar class="topbar">
  <!-- Mobile Menu -->
  @if(!showToggle) {
  <button
    mat-mini-fab
    color="inherit"
    (click)="toggleMobileNav.emit()"
    class="d-flex justify-content-center"
  >
    <i
      class="iconify icon-20 d-flex"
      data-icon="solar:hamburger-menu-line-duotone"
    ></i>
  </button>
  }
  <!-- --------------------------------------------------------------- -->
  <!-- Notification Dropdown -->
  <!-- --------------------------------------------------------------- -->
  <button
    mat-mini-fab
    color="inherit"
    aria-label="Notifications"
    class="d-flex justify-content-center"
  >
    <span  matBadge="1" matBadgeOverlap="false" matBadgeSize="small">
      <i class="iconify icon-20 d-flex" data-icon="solar:bell-line-duotone"></i>
    </span>
  </button>

  <span class="flex-1-auto"></span>

  <!-- --------------------------------------------------------------- -->
  <!-- profile Dropdown -->
  <!-- --------------------------------------------------------------- -->
  <button
    mat-button
    [matMenuTriggerFor]="profilemenu"
    aria-label="Menú de usuario"
    class="profile-trigger"
  >
    <span class="d-flex align-items-center">
      <span class="user-avatar">{{ auth.initials() }}</span>
      <span class="user-meta">
        <span class="user-name">{{ auth.fullName() }}</span>
        <span class="user-role">{{ auth.user()?.rol?.nombre }}</span>
      </span>
      <i class="iconify icon-18 m-l-8" data-icon="solar:alt-arrow-down-line-duotone"></i>
    </span>
  </button>
  <mat-menu #profilemenu="matMenu" class="topbar-dd cardWithShadow">
    <div class="p-x-16 p-y-8">
      <div class="f-w-600">{{ auth.fullName() }}</div>
      <div class="f-s-12 text-muted">{{ auth.user()?.correo }}</div>
    </div>
    <div class="p-x-12 m-t-12">
      <button
        mat-stroked-button
        color="primary"
        class="w-100"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </mat-menu>
</mat-toolbar>
